agentic_team:
  lead_role: project_manager
  max_turns: 12
  roles:
    devops_engineer:
      agent: claude
      responsibilities: Handle deployment/runtime concerns and operational readiness.
      title: DevOps Engineer
    project_manager:
      agent: claude
      responsibilities: Initiate work, route subtasks dynamically, and decide final
        readiness.
      title: Project Manager (Team Lead)
    qa_engineer:
      agent: gemini
      responsibilities: Validate quality, edge cases, and regressions.
      title: QA Engineer
    software_architect:
      agent: gemini
      responsibilities: Define architecture, interfaces, and technical constraints.
      title: Software Architect
    software_developer:
      agent: codex
      responsibilities: Implement required code changes.
      title: Software Developer
agents:
  claude:
    command: claude
    description: Implements feedback and refines code quality
    enabled: true
    role: refinement
    timeout: 3600
    type: cli
  codex:
    command: codex
    description: Primary implementation agent for writing initial code
    enabled: true
    role: implementation
    timeout: 3600
    type: cli
  copilot:
    command: copilot
    description: Provides alternative implementation suggestions
    enabled: false
    role: suggestions
    timeout: 3600
    type: cli
  gemini:
    command: gemini
    description: Reviews code for SOLID principles and best practices
    enabled: true
    role: review
    timeout: 3600
    type: cli
  local-code:
    capabilities:
    - code
    - review
    description: Local coding model via Ollama
    enabled: false
    endpoint: http://localhost:11434
    model: codellama:13b
    offline: true
    timeout: 3600
    type: ollama
  local-instruct:
    capabilities:
    - general
    - docs
    description: Local instruction/reasoning model via Ollama
    enabled: false
    endpoint: http://localhost:11434
    model: mistral:7b-instruct
    offline: true
    timeout: 3600
    type: ollama
  local-large:
    capabilities:
    - code
    - review
    - docs
    description: Local llama.cpp/OpenAI-compatible model endpoint
    enabled: false
    endpoint: http://localhost:8080
    offline: true
    timeout: 3600
    type: llamacpp
settings:
  colored_output: true
  create_reports: true
  fallback:
    enabled: true
    map:
      claude: local-instruct
      codex: local-code
      gemini: local-instruct
  log_file: ai-orchestrator.log
  log_level: INFO
  max_iterations: 3
  min_suggestions_threshold: 3
  offline:
    auto_detect: true
    enabled: false
  output_dir: ./output
  project_path: ''
  reports_dir: ./reports
  workspace_dir: ./workspace
workflows:
  default:
    description: ''
    offline: false
    steps:
    - agent: codex
      description: Create initial implementation
      task: implement
    - agent: gemini
      description: Review for SOLID principles and best practices
      task: review
    - agent: claude
      description: Implement feedback and improvements
      task: refine
  document:
    description: ''
    offline: false
    steps:
    - agent: claude
      description: Generate comprehensive documentation
      task: document
    - agent: gemini
      description: Review documentation quality
      task: review
  hybrid:
    description: Use local for drafts, cloud for final review
    steps:
    - agent: local-code
      role: implementer
    - agent: claude
      fallback: local-instruct
      role: reviewer
  offline-default:
    description: Local-only workflow for offline development
    offline: true
    steps:
    - agent: local-code
      role: implementer
    - agent: local-instruct
      role: reviewer
  quick:
    description: ''
    offline: false
    steps:
    - agent: codex
      description: Quick implementation without review
      task: implement
  review-only:
    description: ''
    offline: false
    steps:
    - agent: gemini
      description: Review existing code
      task: review
    - agent: claude
      description: Implement improvements
      task: refine
  thorough:
    description: ''
    offline: false
    steps:
    - agent: codex
      description: Create initial implementation
      task: implement
    - agent: copilot
      description: Get alternative approaches
      task: suggestions
    - agent: gemini
      description: Comprehensive code review
      task: review
    - agent: claude
      description: Implement all feedback
      task: refine
    - agent: gemini
      description: Verify improvements
      task: review
